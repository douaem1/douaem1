<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6F9"/><stop offset="1" stop-color="#FCEFF3"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C1D40"/><stop offset="1" stop-color="#E0407E"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#8C1D40" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .type{clip-path:inset(0 100% 0 0);animation:type 3.2s steps(46) .6s forwards}
      @keyframes type{to{clip-path:inset(0 0 0 0)}}
      .float1{animation:fl 5s ease-in-out infinite}
      .float2{animation:fl 6s ease-in-out -2s infinite}
      .float3{animation:fl 7s ease-in-out -4s infinite}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      .cat{animation:walk 14s linear infinite}
      @keyframes walk{0%{transform:translateX(-120px)}100%{transform:translateX(1080px)}}
      .legs line{animation:step .35s ease-in-out infinite alternate}
      .legs line:nth-child(2n){animation-delay:-.35s}
      @keyframes step{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
      .tail{transform-origin:6px 0;animation:wag .6s ease-in-out infinite alternate}
      @keyframes wag{from{transform:rotate(-18deg)}to{transform:rotate(12deg)}}
      .dot{animation:pulse 1.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1000" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="320" rx="22" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="997" height="317" rx="21" fill="none" stroke="#E6D7DB" stroke-width="3"/>

  <!-- status pill -->
  <g transform="translate(56,46)">
    <rect width="292" height="30" rx="15" fill="#1F2328"/>
    <circle class="dot" cx="20" cy="15" r="5" fill="#5BE49B"/>
    <text x="34" y="20" class="mono" font-size="13" fill="#fff">status: open_to_pfe · jan 2027</text>
  </g>

  <text x="54" y="138" class="sans" font-size="64" font-weight="800" fill="url(#name)">Douae Moeniss</text>
  <g class="mono" font-size="20" fill="#1F2328">
    <text x="58" y="182" class="type">$ automate --everything --ship-llms-like-software</text>
    <rect class="cursor" x="58" y="166" width="11" height="20" fill="#E0407E" transform="translate(574,0)"/>
  </g>
  <text x="58" y="218" class="sans" font-size="16" fill="#5F6368">AI Automation · DevOps · LLMOps — Computer Engineering @ ENSA Tétouan, class of 2027</text>

  <!-- floating chips -->
  <g class="float1"><rect x="760" y="44" width="170" height="38" rx="19" fill="#fff" stroke="#E0407E" stroke-width="2"/><text x="845" y="69" text-anchor="middle" class="mono" font-size="15" fill="#8C1D40">kubectl apply ✓</text></g>
  <g class="float2"><rect x="700" y="100" width="150" height="38" rx="19" fill="#8C1D40"/><text x="775" y="125" text-anchor="middle" class="mono" font-size="15" fill="#fff">LLM-as-judge</text></g>
  <g class="float3"><rect x="815" y="152" width="130" height="38" rx="19" fill="#fff" stroke="#1F2328" stroke-width="2"/><text x="880" y="177" text-anchor="middle" class="mono" font-size="15" fill="#1F2328">n8n ⚡ AI</text></g>

  <!-- ground line -->
  <line x1="24" y1="300" x2="976" y2="300" stroke="#E6D7DB" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- L3arbi walking -->
  <g class="cat">
    <g transform="translate(0,264)">
      <g class="tail" transform="translate(4,6)"><path d="M0 0 C -14 -4 -20 -18 -14 -30" fill="none" stroke="#8B7A6B" stroke-width="5" stroke-linecap="round"/></g>
      <ellipse cx="26" cy="12" rx="26" ry="14" fill="#B8A898"/>
      <path d="M12 2 q6 -6 12 0 M24 0 q6 -6 12 0" stroke="#7A6A5C" stroke-width="2.5" fill="none"/>
      <g class="legs" stroke="#B8A898" stroke-width="6" stroke-linecap="round">
        <line x1="10" y1="20" x2="10" y2="34" style="transform-origin:10px 20px"/>
        <line x1="18" y1="20" x2="18" y2="34" style="transform-origin:18px 20px"/>
        <line x1="36" y1="20" x2="36" y2="34" style="transform-origin:36px 20px"/>
        <line x1="44" y1="20" x2="44" y2="34" style="transform-origin:44px 20px"/>
      </g>
      <circle cx="56" cy="0" r="14" fill="#C4B5A5"/>
      <path d="M46 -8 l3 -14 l8 9 z M58 -11 l8 -10 l2 14 z" fill="#C4B5A5"/>
      <ellipse cx="57" cy="-24" rx="10" ry="3" fill="none" stroke="#E7C15C" stroke-width="2"/>
      <circle cx="52" cy="-2" r="2.2" fill="#2E3A1E"/><circle cx="61" cy="-2" r="2.2" fill="#2E3A1E"/>
      <path d="M55 4 l1.5 2 l1.5 -2 z" fill="#E59A9A"/>
      <g transform="translate(78,-16)">
        <rect width="150" height="28" rx="14" fill="#fff" stroke="#1F2328" stroke-width="1.5"/>
        <text x="75" y="18" text-anchor="middle" class="sans" font-size="12" fill="#1F2328">Meow. (hire her)</text>
      </g>
    </g>
  </g>
</svg>

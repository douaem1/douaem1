<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .sans{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-16}}
      .next{animation:glow 1.4s ease-in-out infinite}
      @keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
      .spin{transform-origin:900px 108px;animation:spin 2.4s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pop{opacity:0;animation:pop .5s ease forwards}
      @keyframes pop{to{opacity:1}}
    </style>
  </defs>
  <rect width="1000" height="230" rx="18" fill="#FFFFFF" stroke="#E6D7DB" stroke-width="2"/>
  <text x="28" y="38" class="mono" font-size="15" fill="#5F6368">workflow: <tspan fill="#8C1D40" font-weight="700">career.yml</tspan>  ·  trigger: <tspan fill="#1F2328">push to main</tspan></text>
  <line x1="100" y1="108" x2="900" y2="108" stroke="#E0407E" stroke-width="3" class="flow"/>
  <g class="sans">
    <g class="pop" style="animation-delay:.1s"><circle cx="100" cy="108" r="26" fill="#14936F"/><text x="100" y="116" text-anchor="middle" font-size="22" fill="#fff">✓</text>
      <text x="100" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">checkout</text><text x="100" y="180" text-anchor="middle" font-size="12" fill="#5F6368">Prépa · 2022</text></g>
    <g class="pop" style="animation-delay:.5s"><circle cx="300" cy="108" r="26" fill="#14936F"/><text x="300" y="116" text-anchor="middle" font-size="22" fill="#fff">✓</text>
      <text x="300" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">build</text><text x="300" y="180" text-anchor="middle" font-size="12" fill="#5F6368">Engineering · 2024</text></g>
    <g class="pop" style="animation-delay:.9s"><circle cx="500" cy="108" r="26" fill="#14936F"/><text x="500" y="116" text-anchor="middle" font-size="22" fill="#fff">✓</text>
      <text x="500" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">test</text><text x="500" y="180" text-anchor="middle" font-size="12" fill="#5F6368">NTT Data · 2025</text></g>
    <g class="pop" style="animation-delay:1.3s"><circle cx="700" cy="108" r="26" fill="#14936F"/><text x="700" y="116" text-anchor="middle" font-size="22" fill="#fff">✓</text>
      <text x="700" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2328">integrate</text><text x="700" y="180" text-anchor="middle" font-size="12" fill="#5F6368">Quantumize · 2026</text></g>
    <g class="pop" style="animation-delay:1.7s">
      <circle cx="900" cy="108" r="26" fill="#fff" stroke="#8C1D40" stroke-width="3" class="next"/>
      <path class="spin" d="M900 90 a18 18 0 0 1 18 18" fill="none" stroke="#E0407E" stroke-width="4" stroke-linecap="round"/>
      <text x="900" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#8C1D40">deploy</text><text x="900" y="180" text-anchor="middle" font-size="12" fill="#8C1D40">your team · Jan 2027</text></g>
  </g>
  <text x="972" y="212" text-anchor="end" class="mono" font-size="12" fill="#5F6368">waiting for approval from: <tspan fill="#E0407E">you</tspan> ▍</text>
</svg>
